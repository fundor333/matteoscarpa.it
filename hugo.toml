baseURL = "https://matteoscarpa.it/"
locale = "it"
defaultContentLanguage = "it"
title = "Matteo Scarpa — Fotografia"
copyright = "© Matteo Scarpa"
enableRobotsTXT = true
timeZone = "Europe/Rome"
timeout = "120s"
disableKinds = ["taxonomy", "term"]

[params]
  defaultTheme = "dark"
  title = "Matteo Scarpa"
  description = "Fotografo — mostre in corso, passate e future."
  [params.author]
    name = "Matteo Scarpa"
    email = "matteo.scarpa@fundor333.com"
  [params.socialIcons]
    instagram = "https://www.instagram.com/TUO_ACCOUNT/"
    email = "mailto:matteo.scarpa@fundor333.com"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  quality = 82
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[module]
  [module.hugoVersion]
    min = "0.123.0"
  [[module.imports]]
    path = "github.com/nicokaiser/hugo-theme-gallery/v4"
