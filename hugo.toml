baseURL = "https://matteoscarpa.it/"
defaultContentLanguage = "en"
copyright = "© Matteo Scarpa"
enableRobotsTXT = true
timeZone = "Europe/Rome"
timeout = "120s"
disableKinds = ["taxonomy", "term"]

[languages]
[languages.en]
label = "English"
locale = "en-US"
weight = 1
title = "Matteo Scarpa — Photography"
[languages.en.params]
description = "Photographer — current, past and upcoming exhibitions."
[languages.it]
label = "Italiano"
locale = "it-IT"
weight = 2
title = "Matteo Scarpa — Fotografia"
[languages.it.params]
description = "Fotografo — mostre in corso, passate e future."

[params]
defaultTheme = "dark"
title = "Matteo Scarpa"
[params.author]
name = "Matteo Scarpa"
email = "matteo.scarpa@fundor333.com"
[params.socialIcons]
instagram = "https://www.instagram.com/matteo.scarpa3/"
email = "mailto:matteo.scarpa@fundor333.com"

[outputs]
home = ["HTML", "RSS"]
page = ["HTML"]
section = ["HTML"]

[imaging]
quality = 85
resampleFilter = "CatmullRom"
[imaging.exif]
disableDate = false
disableLatLong = true
includeFields = "ImageDescription|Orientation"

[module]
[module.hugoVersion]
min = "0.123.0"
[[module.imports]]
path = "github.com/nicokaiser/hugo-theme-gallery/v4"


[cascade]
[cascade.build]
publishResources = false
