{{ $stato := partial "mostra-stato.html" . }}
<div class="mostra-meta">
  <span class="mostra-stato mostra-stato--{{ $stato }}">
    {{ if eq $stato "corrente" }}In corso
    {{ else if eq $stato "futura" }}In arrivo
    {{ else }}Passata
    {{ end }}
  </span>
  <p>{{ partial "mostra-date-luogo.html" . }}</p>
</div>
